<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#090d16">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Time & Space</title>

  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="mobile-viewport">

    <div id="disguise-view" class="disguise-view">
      <div class="disguise-top-bar">
        <span></span>
        <span id="disguise-battery"></span>
      </div>

      <div class="disguise-center-content">
        <div class="disguise-clock-wrapper">
          <div class="disguise-clock-time">
            <span id="clock-hours">00</span><span class="disguise-colon" onclick="handleSecretEntry()">:</span><span id="clock-minutes">00</span>
          </div>
        </div>
        <div class="disguise-date" id="clock-date">--</div>
        <div class="disguise-quote">"Simplicity is the prerequisite for reliability."</div>
      </div>

      <div class="disguise-footer">
        <span></span>
      </div>
    </div>

    <div id="app-shell" class="app-shell locked">
      <header class="app-header app-header-centered">
        <div class="last-sync-badge-centered" onclick="handleHeaderSyncTap()">
          <span class="sync-dot" id="sync-dot"></span>
          <span id="dyn-last-sync">--</span>
        </div>
      </header>

      <main class="content-area" id="dyn-content-area"></main>

      <nav class="bottom-nav" id="dyn-bottom-nav"></nav>
    </div>

    <div class="modal-overlay" id="price-modal">
      <div class="modal-sheet">
        <div class="sheet-handle"></div>
        <div class="sheet-title" id="modal-item-name"></div>

        <div class="price-input-hero">
          <span class="currency-prefix">Rp</span>
          <input type="tel" id="modal-price-input" class="input-hero-number" placeholder="0" oninput="onPriceModalInput(this)">
        </div>

        <div class="quick-amt-chips">
          <button class="chip-btn" onclick="adjustPriceInput(-5000)">-5k</button>
          <button class="chip-btn" onclick="adjustPriceInput(-1000)">-1k</button>
          <button class="chip-btn" onclick="adjustPriceInput(1000)">+1k</button>
          <button class="chip-btn" onclick="adjustPriceInput(5000)">+5k</button>
          <button class="chip-btn" onclick="adjustPriceInput(10000)">+10k</button>
          <button class="chip-btn" onclick="adjustPriceInput(50000)">+50k</button>
        </div>

        <div class="modal-btn-row">
          <button class="btn-modal-cancel" id="btn-cancel-price" onclick="closePriceModal()">Cancel</button>
          <button class="btn-modal-submit" id="btn-submit-price" onclick="submitPriceModal()">Save</button>
        </div>
      </div>
    </div>

    <div class="modal-overlay" id="terminal-modal">
      <div class="modal-sheet modal-sheet-tall">
        <div class="sheet-handle"></div>

        <div class="terminal-editor-wrap">
          <div class="terminal-editor-label">RAW INPUT</div>
          <textarea
            id="terminal-raw-input"
            class="terminal-textarea"
            spellcheck="false"
            oninput="handleTerminalInputLive()"
          ></textarea>
        </div>

        <div class="terminal-preview-container" id="terminal-parsed-preview"></div>

        <div class="modal-btn-row">
          <button class="btn-modal-cancel" onclick="closeTerminalModal()" id="btn-cancel-terminal">Cancel</button>
          <button class="btn-modal-submit" onclick="submitTerminalBulk()" id="btn-submit-terminal">Save</button>
        </div>
      </div>
    </div>

    <div class="modal-overlay" id="add-shop-modal">
      <div class="modal-sheet">
        <div class="sheet-handle"></div>

        <div class="mode-toggle-group">
          <button type="button" class="mode-toggle-btn active" id="btn-mode-plan" onclick="setAddShopMode('plan')">Plan</button>
          <button type="button" class="mode-toggle-btn" id="btn-mode-done" onclick="setAddShopMode('done')">Done</button>
        </div>

        <div class="form-group-compact">
          <label class="form-label-compact" id="dyn-add-shop-name-label">Name</label>
          <input type="text" id="new-shop-name" class="form-input-compact">
        </div>

        <div class="form-group-compact">
          <label class="form-label-compact" id="dyn-add-shop-ctgr-label">Code</label>
          <select id="new-shop-ctgr" class="form-input-compact"></select>
        </div>

        <div id="shop-done-fields" style="display: none;">
          <div class="form-row-compact">
            <div class="form-group-compact flex-1">
              <label class="form-label-compact" id="dyn-add-shop-amt-label">Amount</label>
              <input type="tel" id="new-shop-amt" class="form-input-compact font-mono" oninput="onShopAmtInput(this)">
            </div>
            <div class="form-group-compact flex-1">
              <label class="form-label-compact" id="dyn-add-shop-date-label">Date</label>
              <input type="date" id="new-shop-date" class="form-input-compact font-mono">
            </div>
          </div>
        </div>

        <div class="form-group-compact">
          <label class="form-label-compact" id="dyn-add-shop-rmk-label">Note</label>
          <input type="text" id="new-shop-rmk" class="form-input-compact">
        </div>

        <div class="modal-btn-row">
          <button class="btn-modal-cancel" onclick="closeAddShopModal()" id="btn-cancel-add-shop">Cancel</button>
          <button class="btn-modal-submit" onclick="submitNewShopItem()" id="btn-submit-add-shop">Save</button>
        </div>
      </div>
    </div>

    <div class="modal-overlay" id="add-task-modal">
      <div class="modal-sheet">
        <div class="sheet-handle"></div>
        <div class="sheet-title" id="dyn-add-task-title"></div>
        <div class="sheet-desc" id="dyn-add-task-desc"></div>

        <div class="form-group-compact">
          <label class="form-label-compact" id="dyn-add-task-name-label"></label>
          <input type="text" id="new-task-title" class="form-input-compact">
        </div>

        <div class="form-group-compact">
          <label class="form-label-compact" id="dyn-add-task-date-label"></label>
          <input type="date" id="new-task-date" class="form-input-compact">
        </div>

        <div class="modal-btn-row">
          <button class="btn-modal-cancel" onclick="closeAddTaskModal()" id="btn-cancel-add-task"></button>
          <button class="btn-modal-submit" onclick="submitNewTaskItem()" id="btn-submit-add-task"></button>
        </div>
      </div>
    </div>

    <div class="modal-overlay" id="add-entry-modal">
      <div class="modal-sheet">
        <div class="sheet-handle"></div>
        <div class="sheet-title" id="dyn-add-entry-title">New Entry</div>

        <div class="form-group-compact">
          <label class="form-label-compact" id="dyn-add-entry-title-label">Topic</label>
          <input type="text" id="new-entry-title" class="form-input-compact">
        </div>

        <div class="form-group-compact">
          <label class="form-label-compact" id="dyn-add-entry-content-label">Reflection</label>
          <textarea id="new-entry-content" class="form-input-compact modal-textarea"></textarea>
        </div>

        <div class="form-group-compact">
          <label class="form-label-compact">Mood</label>
          <div class="mood-btn-group">
            <button type="button" class="mood-pill-btn mood-5 active" id="mood-btn-5" onclick="selectMoodCd('5', this)">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
            </button>
            <button type="button" class="mood-pill-btn mood-4" id="mood-btn-4" onclick="selectMoodCd('4', this)">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg>
            </button>
            <button type="button" class="mood-pill-btn mood-3" id="mood-btn-3" onclick="selectMoodCd('3', this)">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="8" y1="15" x2="16" y2="15"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg>
            </button>
            <button type="button" class="mood-pill-btn mood-2" id="mood-btn-2" onclick="selectMoodCd('2', this)">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M16 16s-1.5-2-4-2-4 2-4 2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg>
            </button>
          </div>
        </div>

        <div class="modal-btn-row">
          <button class="btn-modal-cancel" onclick="closeAddEntryModal()" id="btn-cancel-add-entry">Cancel</button>
          <button class="btn-modal-submit" onclick="submitNewEntryItem()" id="btn-submit-add-entry">Save</button>
        </div>
      </div>
    </div>

    <div class="modal-overlay" id="settings-modal">
      <div class="modal-sheet">
        <div class="sheet-handle"></div>

        <div class="form-group-compact">
          <label class="form-label-compact">Key</label>
          <input type="password" id="settings-key" class="form-input-compact font-mono">
        </div>

        <div class="form-group-compact">
          <label class="form-label-compact">PAT</label>
          <input type="password" id="settings-pat" class="form-input-compact font-mono">
        </div>

        <div class="form-group-compact">
          <label class="form-label-compact">ID</label>
          <input type="text" id="settings-gist-id" class="form-input-compact font-mono">
        </div>

        <div class="modal-btn-row">
          <button class="btn-modal-cancel" onclick="closeSettingsModal()" id="btn-cancel-settings">Cancel</button>
          <button class="btn-modal-submit" onclick="saveSettings()" id="btn-submit-settings">Save</button>
        </div>
      </div>
    </div>

    <div class="toast-notice" id="app-toast"></div>

  </div>

  <script src="app.js"></script>
</body>
</html>
